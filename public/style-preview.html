<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>宝宝爱睡觉 · 月息 · 暖夜实景</title>
<style>
  :root {
    --serif: "Songti SC", "Noto Serif SC", "STSong", serif;
    --sans: "PingFang SC", "Microsoft YaHei", -apple-system, system-ui, sans-serif;
    --cream: #f3ead8;      /* 月下暖白 */
    --cream-dim: #b9ad95;  /* 暖灰 */
    --moon: #f5dfae;
    --hair: rgba(243,234,216,.16);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans); color: var(--cream); overflow: hidden;
    background:
      radial-gradient(120% 70% at 50% 112%, rgba(214,140,80,.20), transparent 55%),
      radial-gradient(100% 60% at 78% -8%, rgba(90,84,150,.35), transparent 60%),
      linear-gradient(180deg, #0a0c1e 0%, #131539 55%, #241f4b 100%);
    -webkit-font-smoothing: antialiased;
  }
  #scene { position: fixed; inset: 0; display: block; }

  /* ---------- 界面层 ---------- */
  .ui { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center;
        max-width: 460px; padding: 40px 36px; z-index: 2; }
  @media (min-width: 900px) { .ui { margin-left: 9vw; } }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 13px; letter-spacing: .32em; color: var(--cream-dim); margin-bottom: 72px; }
  .mark { position: relative; width: 20px; height: 20px; }
  .mark::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--moon); box-shadow: 0 0 10px rgba(245,223,174,.7); }
  .mark::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: #131539; transform: translateX(-30%) scale(.9); }
  h1 { font-family: var(--serif); font-size: 42px; font-weight: 600; line-height: 1.4; letter-spacing: .05em; text-wrap: balance;
       text-shadow: 0 2px 30px rgba(10,10,30,.6); }
  .sub { font-size: 13.5px; color: var(--cream-dim); letter-spacing: .12em; margin: 14px 0 46px; }
  .seg { display: flex; border: 1px solid var(--hair); border-radius: 14px; overflow: hidden; margin-bottom: 12px;
         background: rgba(16,16,40,.35); backdrop-filter: blur(8px); }
  .seg button { flex: 1; padding: 13px 0; font-size: 13.5px; font-family: var(--sans); color: var(--cream-dim);
                background: none; border: none; cursor: pointer; transition: all .25s; }
  .seg button.on { background: rgba(245,223,174,.14); color: var(--cream); }
  .field { width: 100%; border: 1px solid var(--hair); border-radius: 14px; padding: 13px 18px; font-size: 13.5px;
           background: rgba(16,16,40,.35); backdrop-filter: blur(8px); color: var(--cream); outline: none; margin-bottom: 24px; }
  .field::placeholder { color: var(--cream-dim); }
  .field:focus { border-color: rgba(245,223,174,.45); }
  .go { width: 100%; padding: 15px; border: none; border-radius: 14px; cursor: pointer;
        font-size: 14.5px; font-weight: 600; letter-spacing: .55em; text-indent: .55em; color: #241c0e;
        background: linear-gradient(180deg, #f8e8c0, #eed9a4);
        box-shadow: 0 6px 30px rgba(238,217,164,.25), inset 0 1px 0 rgba(255,255,255,.5); transition: transform .2s; }
  .go:hover { transform: translateY(-1px); }
  .foot { text-align: center; font-size: 11.5px; color: var(--cream-dim); margin-top: 16px; letter-spacing: .1em; }

  .caption { position: fixed; z-index: 2; left: 0; right: 0; bottom: 0; padding: 16px 26px 18px;
             display: flex; justify-content: space-between; align-items: baseline; gap: 20px;
             background: linear-gradient(180deg, transparent, rgba(8,8,24,.55)); }
  .caption b { font-family: var(--serif); font-size: 14px; letter-spacing: .2em; }
  .caption span { font-size: 12px; color: var(--cream-dim); }
  @media (max-width: 640px) {
    h1 { font-size: 32px; } .ui { padding: 28px; justify-content: flex-end; padding-bottom: 120px; }
    .brand { margin-bottom: 0; position: fixed; top: 26px; left: 28px; }
    .caption span { display: none; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="ui">
  <div class="brand"><span class="mark"></span>宝宝爱睡觉</div>
  <div>
    <h1>今晚,<br>睡个好觉。</h1>
    <div class="sub">你的主动式睡眠搭子 · 陪你入夜</div>
    <div class="seg"><button class="on">成人</button><button>儿童</button></div>
    <input class="field" placeholder="怎么称呼你?">
    <button class="go">入 夜</button>
    <div class="foot">无需注册 · 一键进入</div>
  </div>
</div>

<div class="caption">
  <b>月息 · 暖夜实景</b>
  <span>ThreeJS 程序化月球(无贴图,可离线)· 星光会眨眼 · 地上有萤火 · 鼠标轻移有视差 · 月亮按呼吸节奏发光</span>
</div>

<script type="importmap">{ "imports": { "three": "/vendor/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
camera.position.set(0, 0, 9);

/* ================= 月球:程序化着色器 ================= */
const NOISE_GLSL = `
  vec3 hash33(vec3 p){ p=vec3(dot(p,vec3(127.1,311.7,74.7)),dot(p,vec3(269.5,183.3,246.1)),dot(p,vec3(113.5,271.9,124.6))); return fract(sin(p)*43758.5453123); }
  float vnoise(vec3 p){ vec3 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);
    float a=dot(hash33(i),vec3(1))/3.0, b=dot(hash33(i+vec3(1,0,0)),vec3(1))/3.0,
          c=dot(hash33(i+vec3(0,1,0)),vec3(1))/3.0, d=dot(hash33(i+vec3(1,1,0)),vec3(1))/3.0,
          e=dot(hash33(i+vec3(0,0,1)),vec3(1))/3.0, g=dot(hash33(i+vec3(1,0,1)),vec3(1))/3.0,
          h=dot(hash33(i+vec3(0,1,1)),vec3(1))/3.0, k=dot(hash33(i+vec3(1,1,1)),vec3(1))/3.0;
    return mix(mix(mix(a,b,f.x),mix(c,d,f.x),f.y),mix(mix(e,g,f.x),mix(h,k,f.x),f.y),f.z); }
  float fbm(vec3 p){ float v=0.0,a=0.5; for(int i=0;i<5;i++){ v+=a*vnoise(p); p*=2.03; a*=0.5; } return v; }
  float voro(vec3 p){ vec3 i=floor(p),f=fract(p); float m=8.0;
    for(int x=-1;x<=1;x++)for(int y=-1;y<=1;y++)for(int z=-1;z<=1;z++){
      vec3 g=vec3(float(x),float(y),float(z)); vec3 o=hash33(i+g); vec3 r=g+o-f; m=min(m,dot(r,r)); }
    return sqrt(m); }
`;
const moonMat = new THREE.ShaderMaterial({
  uniforms: { uLight: { value: new THREE.Vector3(-0.55, 0.35, 0.76).normalize() }, uTime: { value: 0 } },
  vertexShader: `
    varying vec3 vN; varying vec3 vP; varying vec3 vView;
    void main(){ vN = normalize(normalMatrix * normal); vP = position;
      vec4 mv = modelViewMatrix * vec4(position,1.0); vView = normalize(-mv.xyz);
      gl_Position = projectionMatrix * mv; }`,
  fragmentShader: NOISE_GLSL + `
    varying vec3 vN; varying vec3 vP; varying vec3 vView;
    uniform vec3 uLight; uniform float uTime;
    void main(){
      vec3 N = normalize(vN);
      float mare = fbm(vP * 2.2 + 5.0);                 /* 月海明暗 */
      float detail = fbm(vP * 7.0);                     /* 细颗粒 */
      float c1 = voro(vP * 3.2), c2 = voro(vP * 6.5 + 11.0);
      float pits = (1.0 - smoothstep(0.05, 0.28, c1)) * 0.5 + (1.0 - smoothstep(0.04, 0.22, c2)) * 0.35; /* 陨石坑 */
      float rims = (smoothstep(0.30,0.34,c1) - smoothstep(0.34,0.46,c1)) * 0.35;
      vec3 warmA = vec3(0.98, 0.90, 0.72);              /* 暖象牙 */
      vec3 warmB = vec3(0.82, 0.70, 0.50);              /* 暖褐月海 */
      vec3 alb = mix(warmA, warmB, mare * 0.9 + detail * 0.25);
      alb -= pits * vec3(0.30, 0.26, 0.20);
      alb += rims * vec3(0.20, 0.17, 0.10);
      float diff = smoothstep(-0.12, 0.42, dot(N, normalize(uLight)));
      float fres = pow(1.0 - max(dot(N, vView), 0.0), 2.5);
      vec3 col = alb * (0.10 + 0.95 * diff);
      col += fres * vec3(1.0, 0.88, 0.62) * 0.35;       /* 暖边光 */
      col += (1.0 - diff) * vec3(0.06, 0.07, 0.12);     /* 暗面透一点夜色蓝 */
      gl_FragColor = vec4(col, 1.0);
    }`
});
const moon = new THREE.Mesh(new THREE.SphereGeometry(1.55, 96, 96), moonMat);
scene.add(moon);

/* 呼吸光晕(背面球 + 菲涅尔加色) */
const haloMat = new THREE.ShaderMaterial({
  transparent: true, blending: THREE.AdditiveBlending, side: THREE.BackSide, depthWrite: false,
  uniforms: { uPulse: { value: 1 } },
  vertexShader: `varying float vF; void main(){
    vec3 n = normalize(normalMatrix * normal);
    vec4 mv = modelViewMatrix * vec4(position,1.0);
    vF = pow(1.0 + dot(n, normalize(mv.xyz)), 2.6);
    gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `varying float vF; uniform float uPulse;
    void main(){ gl_FragColor = vec4(vec3(1.0,0.85,0.55) * vF * 0.55 * uPulse, vF * 0.5 * uPulse); }`
});
const halo = new THREE.Mesh(new THREE.SphereGeometry(2.05, 64, 64), haloMat);
moon.add(halo);

/* ================= 星空(会眨眼,少数金星) ================= */
function makeStars(count, spread, sizeMul, warmRatio) {
  const pos = new Float32Array(count * 3), phase = new Float32Array(count),
        speed = new Float32Array(count), size = new Float32Array(count), warm = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    const v = new THREE.Vector3().randomDirection().multiplyScalar(spread * (0.7 + Math.random() * 0.5));
    v.z = -Math.abs(v.z) - 6;                       /* 全部铺在镜头后方远处 */
    pos.set([v.x, v.y * 0.8 + 1.5, v.z], i * 3);
    phase[i] = Math.random() * Math.PI * 2;
    speed[i] = 0.4 + Math.random() * 1.1;
    size[i] = (Math.random() * 1.6 + 0.5) * sizeMul;
    warm[i] = Math.random() < warmRatio ? 1 : 0;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aPhase', new THREE.BufferAttribute(phase, 1));
  g.setAttribute('aSpeed', new THREE.BufferAttribute(speed, 1));
  g.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
  g.setAttribute('aWarm', new THREE.BufferAttribute(warm, 1));
  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uTime: { value: 0 } },
    vertexShader: `attribute float aPhase; attribute float aSpeed; attribute float aSize; attribute float aWarm;
      uniform float uTime; varying float vA; varying float vW;
      void main(){ vW = aWarm;
        vA = 0.45 + 0.55 * sin(uTime * aSpeed + aPhase);
        vec4 mv = modelViewMatrix * vec4(position,1.0);
        gl_PointSize = aSize * (140.0 / -mv.z);
        gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `varying float vA; varying float vW;
      void main(){ float d = length(gl_PointCoord - 0.5);
        float a = (1.0 - smoothstep(0.08, 0.5, d)) * vA;
        vec3 c = mix(vec3(0.85,0.89,1.0), vec3(1.0,0.85,0.55), vW);
        gl_FragColor = vec4(c, a); }`
  });
  return new THREE.Points(g, m);
}
const stars = makeStars(900, 30, 1.0, 0.16);
scene.add(stars);

/* ================= 萤火(贴地暖光,陪伴感) ================= */
const FCOUNT = 26;
const fpos = new Float32Array(FCOUNT * 3), fseed = new Float32Array(FCOUNT);
for (let i = 0; i < FCOUNT; i++) {
  fpos.set([(Math.random() - 0.5) * 16, -2.2 - Math.random() * 1.6, -2 - Math.random() * 5], i * 3);
  fseed[i] = Math.random() * 100;
}
const fgeo = new THREE.BufferGeometry();
fgeo.setAttribute('position', new THREE.BufferAttribute(fpos, 3));
fgeo.setAttribute('aSeed', new THREE.BufferAttribute(fseed, 1));
const fmat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { uTime: { value: 0 } },
  vertexShader: `attribute float aSeed; uniform float uTime; varying float vA;
    void main(){
      vec3 p = position;
      p.x += sin(uTime * 0.20 + aSeed) * 0.8;
      p.y += sin(uTime * 0.33 + aSeed * 1.7) * 0.45 + sin(uTime*0.11+aSeed)*0.3;
      vA = 0.35 + 0.65 * (0.5 + 0.5 * sin(uTime * 0.9 + aSeed * 3.0));
      vec4 mv = modelViewMatrix * vec4(p,1.0);
      gl_PointSize = (10.0 + 6.0 * vA) * (30.0 / -mv.z);
      gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `varying float vA;
    void main(){ float d = length(gl_PointCoord - 0.5);
      float a = (1.0 - smoothstep(0.0, 0.5, d)) * vA * 0.85;
      gl_FragColor = vec4(vec3(1.0, 0.78, 0.42), a); }`
});
scene.add(new THREE.Points(fgeo, fmat));

/* ================= 布局 / 视差 / 呼吸 ================= */
function layout() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  if (w < 640) { moon.position.set(0.4, 2.6, 0); moon.scale.setScalar(0.72); }
  else { moon.position.set(3.1, 1.35, 0); moon.scale.setScalar(1); }
}
layout(); addEventListener('resize', layout);

let px = 0, py = 0;
addEventListener('pointermove', e => {
  px = (e.clientX / innerWidth - 0.5) * 2;
  py = (e.clientY / innerHeight - 0.5) * 2;
});

const clock = new THREE.Clock();
function tick() {
  const t = clock.getElapsedTime();
  moonMat.uniforms.uTime.value = t;
  stars.material.uniforms.uTime.value = t;
  fmat.uniforms.uTime.value = t;
  /* 呼吸:吸4s 呼6s(10s 周期) */
  const ph = (t % 10) / 10;
  const breath = ph < 0.4 ? 0.5 - 0.5 * Math.cos(ph / 0.4 * Math.PI) : 0.5 + 0.5 * Math.cos((ph - 0.4) / 0.6 * Math.PI);
  haloMat.uniforms.uPulse.value = 0.72 + 0.38 * breath;
  moon.rotation.y = t * 0.012;
  if (!reduced) {
    camera.position.x += ((px * 0.35) - camera.position.x) * 0.03;
    camera.position.y += ((-py * 0.22) - camera.position.y) * 0.03;
    camera.lookAt(0.8, 0.4, 0);
  }
  renderer.render(scene, camera);
  if (!reduced) requestAnimationFrame(tick);
}
if (reduced) { haloMat.uniforms.uPulse.value = 1; renderer.render(scene, camera); }
else requestAnimationFrame(tick);
</script>
</body>
</html>
